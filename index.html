
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja registradora</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Mi caja registradora</h1>
        <p>Gestión de billetes, monedas y cambio</p>
    </header>

    <main>
        <section class="compra">
            <h2>Nueva compra</h2>

            <label for="precio">Precio de la compra (€)</label>
            <input
                type="number"
                id="precio"
                min="0.01"
                step="0.01"
                placeholder="Ej. 17.50"
            >

            <label for="denominacion">El cliente paga con</label>
            <select id="denominacion">
                <option value="500">Billete de 500 €</option>
                <option value="200">Billete de 200 €</option>
                <option value="100">Billete de 100 €</option>
                <option value="50">Billete de 50 €</option>
                <option value="20" selected>Billete de 20 €</option>
                <option value="10">Billete de 10 €</option>
                <option value="5">Billete de 5 €</option>
                <option value="2">Moneda de 2 €</option>
                <option value="1">Moneda de 1 €</option>
                <option value="0.5">Moneda de 0,50 €</option>
                <option value="0.2">Moneda de 0,20 €</option>
                <option value="0.1">Moneda de 0,10 €</option>
                <option value="0.05">Moneda de 0,05 €</option>
                <option value="0.02">Moneda de 0,02 €</option>
                <option value="0.01">Moneda de 0,01 €</option>
            </select>

            <label for="cantidadPago">Cantidad de billetes o monedas</label>
            <input
                type="number"
                id="cantidadPago"
                min="1"
                step="1"
                value="1"
            >

            <button id="procesar">Procesar compra</button>

            <div id="resultado" aria-live="polite"></div>
        </section>

        <section>
            <h2>Billetes disponibles</h2>
            <div id="billetes" class="caja"></div>
        </section>

        <section>
            <h2>Monedas disponibles</h2>
            <div id="monedas" class="caja"></div>
        </section>

        <div class="total">
            Total en caja: <span id="total">0,00 €</span>
        </div>
    </main>

</body>
</html>
